name: workflow

# Runs untrusted fork code, so use pull_request (no secrets, read-only token),
# never pull_request_target.
on:
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  validate:
    name: validate ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: classes
            module: _validate_classes
          - name: io
            module: _validate_io
          - name: simulator
            module: _validate_simulator

    steps:
      - name: checkout tsnkit
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install dependencies
        run: pip install -q -r requirements.txt seaborn
      - name: validate ${{ matrix.name }}
        run: python -m tsnkit.test.debug.${{ matrix.module }}

  validate_algorithms:
    name: validate algorithms
    runs-on: ubuntu-latest

    steps:
      - name: checkout tsnkit
        uses: actions/checkout@v6
        with:
          fetch-depth: 2 # HEAD is the merge commit, HEAD^1 is main
          lfs: true
          persist-credentials: false
      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install dependencies
        # cplex on PyPI is the Community Edition, it also ships cpoptimizer
        run: pip install -q -r requirements.txt seaborn cplex

      - name: run test
        shell: bash # enables pipefail
        run: |
          changed=$(git diff --name-only --diff-filter=d HEAD^1 HEAD \
            | sed -nE 's#^tsnkit/algorithms/([a-z0-9][a-z0-9_]*)\.py$#\1#p')
          models=$(printf '%s\n' $changed ls smt_wa jrs_nw cp_wa | sort -u)
          echo "algorithms:" $models
          python -m tsnkit.test.debug $models --subset
